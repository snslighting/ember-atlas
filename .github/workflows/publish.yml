name: Refresh NASA and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            data/history/uzbekistan/recent
            data/history/california/recent
            data/history/amazon/recent
          key: history-nrt-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: history-nrt-v1-
      - run: npm ci
      - name: Fetch actual NASA observations
        env:
          FIRMS_PUBLIC_DOWNLOADS: "1"
        run: npm run data:refresh
      - run: node analyze-data.js
      - run: node analyze-history.js
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
